experiment:
  name: pretrain_v3
  seed: 42

paths:
  output_root: outputs/

data:
  input_folders: ["causal_knowledge_v11"]
  synthetic_root: ../synthetic_data/

  batch_size: 256           # per GPU; effective batch = 256 × n_gpus
  num_workers: 8
  pin_memory: true

  chunksize: 4096
  prefetch_factor: 2
  persistent_workers: true

  max_files: null           # null = use all 500 worlds
  max_rows_per_file: null
  rows_per_file: 20000      # used to estimate steps_per_epoch

  file_glob: "*.csv"

  sex_col: sex
  id_col: Sample_ID
  exclude_cols: []
  target_column: severity

model:
  d_model: 256
  num_layers: 6
  nhead: 8
  dim_feedforward: 512
  dropout: 0.1
  use_cls: true
  value_hidden_dim: 64
  value_encoder_layers: 2

vae:
  latent_dim: 64

optimizer:
  name: adamw
  lr: 0.0003
  weight_decay: 0.0001

validation:
  split_ratio: 0.1          # 50 val worlds, 450 train worlds

pretraining:
  epochs: 20

  # Set steps_per_epoch: null to run full epochs over all data.
  # With 450 train files × 20k rows / (256 × 4 GPUs) ≈ 8,789 steps/epoch.
  steps_per_epoch: null
  val_steps: 500

  warmup_steps: 2000
  vae_lambda_recon: 0.5     # weight of VAE loss relative to masked MSE
  vae_beta_kl: 0.001        # target beta for KL term
  kl_beta_start: 0.0        # beta at step 0 (ramps up to vae_beta_kl)
  kl_anneal_steps: 20000    # steps to reach full vae_beta_kl; 0 = no annealing

  mask_ratio: 0.20          # 20% of lipids masked per sample
  mask_token_prob: 0.80
  random_replace_prob: 0.10
  keep_original_prob: 0.10

  amp: true
  amp_dtype: bf16
  grad_accum_steps: 1       # with batch=256 × 4 GPUs no accum needed
  clip_grad_norm: 1.0
